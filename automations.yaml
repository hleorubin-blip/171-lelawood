- id: '1772633218168'
  alias: Sitting Room Lamps
  description: ''
  triggers:
  - trigger: time
    at: 06:00:00
    weekday:
    - sun
    - mon
    - tue
    - wed
    - thu
    - fri
    - sat
    id: morning_on
    alias: morning_on
  - trigger: state
    entity_id:
    - scene.good_night
    to:
    - 'on'
    alias: goodnight_off
    id: goodnight_off
  - trigger: state
    entity_id:
    - input_boolean.input_boolean_away_mode
    to:
    - 'on'
    alias: away_off
    id: away_off
  - trigger: state
    entity_id:
    - input_boolean.input_boolean_away_mode
    to:
    - 'off'
    alias: arrive_on
    id: arrive_on
  conditions: []
  actions:
  - choose:
    - conditions:
      # arrive_on fires when away_mode clears, so it needs no gate. morning_on is
      # a bare 06:00 time trigger and would otherwise switch these lamps on every
      # day of a trip, with only the Good Night scene able to switch them back.
      - condition: or
        conditions:
        - condition: trigger
          id:
          - arrive_on
        - condition: and
          conditions:
          - condition: trigger
            id:
            - morning_on
          - condition: state
            entity_id: input_boolean.input_boolean_away_mode
            state: 'off'
          - condition: state
            entity_id: input_boolean.vacation_mode
            state: 'off'
      sequence:
      - type: turn_on
        device_id: 75ebeb25323fff8d723bb7cda31b6774
        entity_id: 2f130209bc3f31d19ad65dc3f96ca62c
        domain: light
      - type: turn_on
        device_id: 0f667372067b6df6f356cc51721e0117
        entity_id: 2cf48f56e56c57bf834a7608194debf6
        domain: light
  - choose:
    - conditions:
      - condition: trigger
        id:
        - goodnight_off
        - away_off
      sequence:
      - type: turn_off
        device_id: 75ebeb25323fff8d723bb7cda31b6774
        entity_id: 2f130209bc3f31d19ad65dc3f96ca62c
        domain: light
      - type: turn_off
        device_id: 0f667372067b6df6f356cc51721e0117
        entity_id: 2cf48f56e56c57bf834a7608194debf6
        domain: light
  mode: single
