- id: '1783468800000'
  alias: Hallway Overhead
  description: 'Three-mode dim-standby: Day (5AM-sunset) 20% standby / 60% motion
    boost, Evening (sunset-Good Night) 5% / 30%, Night (good_night ON) off / 1%
    boost. Custom YAML - pattern not supported by Blacky. Not in the Good Morning
    retrigger; has its own time triggers (CLAUDE.md rule 8).'
  # Hallway lights are Hue bulbs whose entity IDs predate the "Hall 1"/"Hall 2"
  # renames: Hall 1 = light.hue_white_lamp_16, Hall 2 = light.hue_white_lamp_16_3.
  # Verified against the live instance 2026-07-08 - do not "fix" to light.hall_*.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.hallway_motion
    to: 'on'
    id: motion
  # TUNING: if the 2s clear causes boost/dim flapping when someone pauses in the
  # hallway, add `for: "00:00:05"` to this clear trigger to require sustained
  # clear before dimming back. Deliberately omitted for v1.
  - trigger: state
    entity_id:
    - binary_sensor.hallway_motion
    to: 'off'
    id: clear
  - trigger: time
    at: 05:00:00
    id: mode_shift
  - trigger: sun
    event: sunset
    id: mode_shift
  - trigger: state
    entity_id:
    - input_boolean.input_boolean_good_night
    to: 'on'
    id: mode_shift
  - trigger: state
    entity_id:
    - input_boolean.input_boolean_good_night
    to: 'off'
    id: mode_shift
  - trigger: state
    entity_id:
    - input_boolean.vacation_mode
    to: 'on'
    id: mode_shift
  - trigger: state
    entity_id:
    - input_boolean.vacation_mode
    to: 'off'
    id: mode_shift
  conditions: []
  actions:
  - choose:
    # Motion -> boost both lights to the current mode's level
    - conditions:
      - condition: trigger
        id:
        - motion
      sequence:
      - choose:
        # Vacation: nobody lives here this week, but a plant-sitter still needs
        # to see the hallway. Checked before good_night, which is stuck OFF while
        # away (Good Morning - 5AM clears it daily, nothing sets it).
        - conditions:
          - condition: state
            entity_id: input_boolean.vacation_mode
            state: 'on'
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.hue_white_lamp_16
              - light.hue_white_lamp_16_3
            data:
              brightness_pct: 30
              transition: 1
        # Night: good_night ON
        - conditions:
          - condition: state
            entity_id: input_boolean.input_boolean_good_night
            state: 'on'
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.hue_white_lamp_16
              - light.hue_white_lamp_16_3
            data:
              brightness_pct: 1
              transition: 1
        # Day: 5:00 AM -> sunset
        - conditions:
          - condition: time
            after: 05:00:00
          - condition: sun
            before: sunset
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.hue_white_lamp_16
              - light.hue_white_lamp_16_3
            data:
              brightness_pct: 60
              transition: 1
        # Evening: sunset -> Good Night
        default:
        - action: light.turn_on
          target:
            entity_id:
            - light.hue_white_lamp_16
            - light.hue_white_lamp_16_3
          data:
            brightness_pct: 30
            transition: 1
    # Sensor clear, or a mode boundary -> current mode's standby level
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id:
          - mode_shift
        - condition: and
          conditions:
          - condition: trigger
            id:
            - clear
          - condition: state
            entity_id: binary_sensor.hallway_motion
            state: 'off'
      sequence:
      - choose:
        # Vacation: no standby glow. The evening look is carried by the living
        # room lamps; an always-on hallway would just burn for two weeks.
        - conditions:
          - condition: state
            entity_id: input_boolean.vacation_mode
            state: 'on'
          sequence:
          - action: light.turn_off
            target:
              entity_id:
              - light.hue_white_lamp_16
              - light.hue_white_lamp_16_3
            data:
              transition: 1
        # Night: off (Good Night scene also turns lights off - don't fight it,
        # just ensure the hallway ends up off)
        - conditions:
          - condition: state
            entity_id: input_boolean.input_boolean_good_night
            state: 'on'
          sequence:
          - action: light.turn_off
            target:
              entity_id:
              - light.hue_white_lamp_16
              - light.hue_white_lamp_16_3
            data:
              transition: 1
        # Day standby
        - conditions:
          - condition: time
            after: 05:00:00
          - condition: sun
            before: sunset
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.hue_white_lamp_16
              - light.hue_white_lamp_16_3
            data:
              brightness_pct: 20
              transition: 1
        # Evening standby
        default:
        - action: light.turn_on
          target:
            entity_id:
            - light.hue_white_lamp_16
            - light.hue_white_lamp_16_3
          data:
            brightness_pct: 5
            transition: 1
  mode: restart
# ---------------------------------------------------------------------------
# VACATION MODE
#
# Gated on input_boolean.vacation_mode (UI helper - create before enabling).
# Distinct from away_mode: away = short trip, house goes dark. Vacation = house
# should read as occupied. Vacation turns away_mode ON as its first act, which
# bypasses every Blacky instance to OFF and gives these automations a clean
# canvas to paint on - the blueprints and the vacation look never fight over
# the same lamp.
#
# Occupied look is light.brown_lamp + light.guzzini only.
# light.silver_lamp is deliberately excluded (CLAUDE.md entity topology).
# ---------------------------------------------------------------------------
- id: '1788000000001'
  alias: Vacation Mode - Sync Away Mode
  description: 'Vacation ON also flips away_mode ON so all Blacky instances bypass
    to OFF. Vacation OFF releases them. This is the only automation that writes
    away_mode - everything else reads it.'
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.vacation_mode
    to: 'on'
    id: vacation_on
  - trigger: state
    entity_id:
    - input_boolean.vacation_mode
    to: 'off'
    id: vacation_off
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - vacation_on
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.input_boolean_away_mode
    - conditions:
      - condition: trigger
        id:
        - vacation_off
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.input_boolean_away_mode
  mode: single
- id: '1788000000002'
  alias: Vacation Mode - Exterior Lights
  description: 'Exterior on at sunset, off at sunrise, while vacation is active.
    Brightness matches the Good Night scene so the house looks the same from the
    street as it does on a normal night. Nothing else in this config touches the
    exterior lights.'
  triggers:
  - trigger: sun
    event: sunset
    id: dusk
  - trigger: sun
    event: sunrise
    id: dawn
  conditions:
  - condition: state
    entity_id: input_boolean.vacation_mode
    state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - dusk
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.front_porch
        data:
          brightness_pct: 65
      - action: light.turn_on
        target:
          entity_id:
          - light.front_flood
        data:
          brightness_pct: 75
      - action: light.turn_on
        target:
          entity_id:
          - light.back_porch
          - light.back_flood
        data:
          brightness_pct: 100
    - conditions:
      - condition: trigger
        id:
        - dawn
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.front_porch
          - light.front_flood
          - light.back_porch
          - light.back_flood
  mode: single
- id: '1788000000003'
  alias: Vacation Mode - Evening Lamps
  description: 'Occupied look: brown lamp + guzzini at 20% from sunset, off at a
    random point between 23:30 and 00:30 so it does not read as clockwork from the
    street. Silver lamp excluded.'
  # mode: single is safe here even though the off branch holds the automation
  # busy for up to an hour: Nashville sunset never falls inside 23:30-00:30, so
  # the two branches cannot overlap. Do NOT switch to restart - it would cancel
  # an in-flight random delay.
  triggers:
  - trigger: sun
    event: sunset
    id: dusk
  - trigger: time
    at: '23:30:00'
    id: bedtime
  conditions:
  - condition: state
    entity_id: input_boolean.vacation_mode
    state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - dusk
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.brown_lamp
          - light.guzzini
        data:
          brightness_pct: 20
          transition: 2
    - conditions:
      - condition: trigger
        id:
        - bedtime
      sequence:
      # 0-60 min of jitter on top of 23:30
      - delay:
          seconds: '{{ range(0, 3601) | random }}'
      # Re-check: the delay can outlive vacation mode being switched off.
      - condition: state
        entity_id: input_boolean.vacation_mode
        state: 'on'
      - action: light.turn_off
        target:
          entity_id:
          - light.brown_lamp
          - light.guzzini
        data:
          transition: 4
  mode: single
- id: '1788000000004'
  alias: Vacation Mode - Motion Override
  description: 'Whoever is watering the plants gets usable light for 30 minutes,
    then the house returns to its vacation baseline. Overheads only while the sun
    is up - after sunset this stays lamps-only so the house keeps its evening look.'
  # TUNING: the FP2 reports continuous presence, so a visitor who stays put past
  # 30 min gets dropped until they move past the kitchen or hallway sensor. If
  # that proves annoying, raise the delay rather than adding a second timer.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.living_room_motion_devices
    - binary_sensor.kitchen_motion
    - binary_sensor.hallway_motion
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.vacation_mode
    state: 'on'
  actions:
  - action: light.turn_on
    target:
      entity_id:
      - light.brown_lamp
      - light.guzzini
    data:
      brightness_pct: 60
      transition: 1
  # Daytime only: give them the kitchen overhead too.
  - if:
    - condition: sun
      before: sunset
      after: sunrise
    then:
    - action: light.turn_on
      target:
        entity_id: light.d26hd
      data:
        brightness_pct: 60
  - delay: 00:30:00
  - condition: state
    entity_id: input_boolean.vacation_mode
    state: 'on'
  - action: light.turn_off
    target:
      entity_id: light.d26hd
  # Restore the baseline: evening look between sunset and 23:30, otherwise dark.
  - if:
    - condition: sun
      after: sunset
    - condition: time
      before: '23:30:00'
    then:
    - action: light.turn_on
      target:
        entity_id:
        - light.brown_lamp
        - light.guzzini
      data:
        brightness_pct: 20
        transition: 4
    else:
    - action: light.turn_off
      target:
        entity_id:
        - light.brown_lamp
        - light.guzzini
      data:
        transition: 4
  mode: restart
- id: '1788000000005'
  alias: Vacation Mode - Deactivation Cleanup
  description: 'Vacation OFF: clear the exterior and the occupied-look lamps. The
    interior blueprints resume on their own once Sync Away Mode releases away_mode.'
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.vacation_mode
    to: 'off'
  conditions: []
  actions:
  - action: light.turn_off
    target:
      entity_id:
      - light.front_porch
      - light.front_flood
      - light.back_porch
      - light.back_flood
      - light.brown_lamp
      - light.guzzini
  mode: single
